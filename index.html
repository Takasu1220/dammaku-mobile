<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弾幕系シューティングゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        <div id="ui-layer">
            <div id="touch-controls">
    <!-- 左側：移動用十字パッド -->
            <div id="d-pad">
            <button class="pad-btn up" data-key="ArrowUp">▲</button>
            <div class="pad-row">
            <button class="pad-btn left" data-key="ArrowLeft">◀</button>
            <div class="pad-center"></div>
            <button class="pad-btn right" data-key="ArrowRight">▶</button>
            </div>
        <button class="pad-btn down" data-key="ArrowDown">▼</button>
    </div>

    <!-- 右側：アクションボタン -->
    <div id="action-buttons">
        <button class="action-btn slow-btn" data-key="Shift">低速</button>
        <button class="action-btn shot-btn" data-key="z">Shot</button>
        </div>
          </div>
        <button class="action-btn slow-btn" data-key="Shift">低速</button>
        <button class="action-btn shot-btn" data-key="z">Shot</button>
        </div>
          </div>
            <div id="score-board">SCORE: <span id="score">0</span></div>
            <div id="life-board">LIFE: <span id="lives">3</span></div>
            <div id="game-over-screen" class="hidden">
                <h1>GAME OVER</h1>
                <p>SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn">もう一度プレイ</button>
            </div>
        </div>
    </div>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
